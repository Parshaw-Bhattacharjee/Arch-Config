[main]
font=JetBrainsMono Nerd Font:size=12
terminal=alacritty -e
prompt="> "
icons-enabled=yes
icon-theme=Papirus-Dark
width=40
lines=10
horizontal-pad=20
vertical-pad=12
inner-pad=8
layer=overlay
anchor=center
exit-on-keyboard-focus-loss=yes

[colors]
background=14141cee
text=e6e6f0ff
prompt=7aa2f7ff
input=e6e6f0ff
match=7aa2f7ff
selection=3b4261ff
selection-text=ffffffff
selection-match=7aa2f7ff
border=3b4261ff

[border]
width=2
radius=10

[dmenu]
exit-immediately-if-empty=no